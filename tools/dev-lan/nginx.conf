# خادم التطوير على شبكة البيت: كل تطبيق مبنياً على منفذه، و/api إلى خلفية التطوير.
# /madad-dev.json: علامة يبحث عنها غلاف التطوير في الهاتف ليجد الحاسوب (نسخ التطوير وحدها).
server_tokens off;
server {
  listen 5181;
  root /apps/admin/dist;
  client_max_body_size 11m;
  location /api/ { proxy_pass http://madad-dev-api:8000; proxy_set_header Host $host; }
  location = /madad-dev.json {
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-store" always;
    return 200 '{"madad":"dev","app":"admin"}';
  }
  location / { try_files $uri /index.html; add_header Cache-Control "no-store"; }
}
