# كل تطبيق بنطاقه الفرعي، و/api إلى الخلفية. الصور حتى 10 ميغا (قيد القاعدة) فالحدّ 11 ميغا.
map $host $app_root {
    default                      /srv/customer;
    madad.tajora.ly              /srv/customer;
    admin.madad.tajora.ly        /srv/admin;
    supplier.madad.tajora.ly     /srv/supplier;
    driver.madad.tajora.ly       /srv/driver;
}

server {
    listen 80;
    client_max_body_size 11m;
    root $app_root;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
