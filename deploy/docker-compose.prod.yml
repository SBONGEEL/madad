# مَدَد — تشغيل الإنتاج (§14): القاعدة، والخلفية (مع عامل الإشعارات داخلها)، والواجهات الأربع خلف nginx،
# ونفق Cloudflare. لا منفذ مفتوح للعالم غير النفق. كل سرّ من .env على الخادم.
name: madad

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Africa/Tripoli
    volumes:
      - madad_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 30

  migrate:
    build: {context: ../backend}
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on: {db: {condition: service_healthy}}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"

  backend:
    build: {context: ../backend}
    restart: unless-stopped
    env_file: [.env]
    environment:
      MADAD_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    volumes:
      - madad_media:/data/media
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args: {VITE_MAPBOX_TOKEN: "${VITE_MAPBOX_TOKEN}"}
    restart: unless-stopped
    depends_on: [backend]

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN}"]
    depends_on: [web]

volumes:
  madad_db:
  madad_media:
