<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>$title</title>
<style>
$tokens
@page { size: A4; margin: 18mm 16mm; }
body { font-family: "Tajawal", "Inter", sans-serif; color: var(--ink); font-size: 11pt; line-height: 1.6; }
.num { font-family: "Inter", "Tajawal", sans-serif; font-variant-numeric: tabular-nums; unicode-bidi: isolate; direction: ltr; }
header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding-bottom: 8px; margin-bottom: 14px; }
header img { height: 40px; }
h1 { font-size: 16pt; margin: 0; color: var(--primary); }
.muted { color: var(--ink-muted); font-size: 9.5pt; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th { text-align: right; font-weight: 700; font-size: 9.5pt; color: var(--ink-muted); border-bottom: 1px solid var(--border-strong); padding: 6px 4px; }
td { border-bottom: 1px solid var(--border); padding: 6px 4px; }
td.n { text-align: left; }
.total { display: flex; justify-content: space-between; font-weight: 700; font-size: 13pt; margin-top: 12px; }
.box { border: 1px solid var(--border-strong); border-radius: 8px; padding: 8px 10px; margin-top: 10px; }
</style>
</head>
<body>
<header><h1>$title</h1><img src="$logo" alt="مدد"></header>
$body
</body>
</html>
